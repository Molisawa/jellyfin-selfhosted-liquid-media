# Transcoding NVIDIA (Windows WSL2 o Linux con nvidia-container-toolkit).
# Uso: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
services:
  jellyfin:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all # NVENC/NVDEC necesitan "video", no solo "compute"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
